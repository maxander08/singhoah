<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SinghoModule — visual automation</title>
<meta name="description" content="SinghoClock's automation app: wire Text, Markdown and Output modules together on a grid canvas, then run the flow.">
<meta name="color-scheme" content="dark light">
<script>
  /* dark is the default scheme; a stored preference wins, pre-paint */
  try { if ((localStorage.getItem('singhoah:night') || '1') === '1') document.documentElement.classList.add('dark'); }
  catch (e) { document.documentElement.classList.add('dark'); }
</script>

<body data-app="module">

<header class="topbar">
  <div class="brand"><p class="wordmark">S<em>ingho</em>Module</p><p class="wordmark-zh" lang="zh-Hant">模組</p></div>
  <div class="controls">
    <div class="langwrap">
      <button type="button" class="btn tz-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" title="Language · 語言">
        <img id="langFlag" class="flag" alt="" width="20" height="15">
        <span id="langLabel">EN</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <div class="tz-pop lang-pop" id="langPop" hidden>
        <div class="tz-list" id="langList" role="listbox" aria-label="Language"></div>
      </div>
    </div>
    <button type="button" class="btn" id="btnNight" aria-pressed="false" title="Toggle night shift (N)">

    <a class="btn" id="btnLaunch" href="launch.html" title="Launchpad">

    </a>

      <span id="clockText">Clock</span>
    </a>
    <a class="btn" id="btnSettings" href="settings.html" title="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z" stroke="currentColor" stroke-width="1.5"/></svg>

  <div class="authwrap" id="authWrap"></div>
  </div>
</header>

<section class="fl-home mod-homebox" id="modHome" hidden></section>

<main class="mod-app" id="modEditor" hidden>
  <div class="mod-bar">
    <button type="button" class="btn scr-ic" id="modFiles" title="Files" aria-label="Files"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="8" height="8" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" fill="currentColor"/></svg></button>
    <input id="modTitle" class="mod-title" placeholder="Untitled flow" aria-label="Flow title">
    <span class="mod-saved" id="modSaved" aria-live="polite"></span>
    <span class="mod-grow"></span>
    <button type="button" class="btn mod-add" data-add="text"><span class="mod-dot" style="background:#4a76b8"></span><span id="modAddT">Text</span></button>
    <button type="button" class="btn mod-add" data-add="code"><span class="mod-dot" style="background:#8b5fbf"></span><span id="modAddC">Code</span></button>
    <button type="button" class="btn mod-add" data-add="output"><span class="mod-dot" style="background:#c9a24a"></span><span id="modAddO">Output</span></button>
    <button type="button" class="btn" id="modGrid" aria-pressed="true"><span id="modGridT">Grid</span></button>
    <button type="button" class="btn" id="modRun"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4.5v15l13-7.5-13-7.5Z" fill="currentColor"/></svg><span id="modRunT">Run</span></button>
    <button type="button" class="btn scr-ic" id="modExport" title="Export" aria-label="Export"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="btn scr-ic" id="modImport" title="Import" aria-label="Import"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4m0 0 4 4m-4-4-4 4M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <input type="file" id="modFile" accept=".json,application/json" hidden>
  </div>
  <div class="mod-canvas" id="modCanvas">
    <div class="mod-world" id="modWorld">
      <svg class="mod-wires" id="modWires" width="4000" height="3000" aria-hidden="true"></svg>
    </div>
    <div class="mod-zoom">
      <button type="button" class="btn" id="modZoomOut" aria-label="Zoom out">−</button>
      <button type="button" class="btn" id="modZoomR">100%</button>
      <button type="button" class="btn" id="modZoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>
</main>
