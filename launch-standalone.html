<style>
/* ============================================================
   Singhoah — style
   Palette + type taken from displaay.net:
   paper #f2f0e6 · black #000 · pigeon #76756f · notification #000dff
   Saans (variable, wght 300–900 + MONO axis), Serrif, DP Overals
   ============================================================ */

:root {
  --paper: #f2f0e6;
  --black: #000000;
  --pigeon: #76756f;
  --notification: #000dff;
  --on-notification: #f2f0e6;
  --paper-2: #e6e4da;
  --border: #000000;
  --font-sans: "Saans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-serif: "Serrif", Georgia, serif;
  --radius: 6px;        /* controls, rows, inputs */
  --radius-lg: 8px;     /* popups, cards, panels */
  --gap: 8px;           /* between sibling controls */
  --h-ctl: 34px;        /* buttons */
  --h-field: 38px;      /* text inputs / fields */
  --pad-side: 20px;     /* page-band horizontal padding */
}

.dark {
  /* night shift: true black, not navy */
  --paper: #000000;
  --black: #ffffff;
  --pigeon: #898a90;
  --notification: #fff200;
  --on-notification: #000000;
  --paper-2: #121212;
  --border: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; }

:root { color-scheme: light; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;   /* desktop: app surface, no page scrolling */
}

/* Scrollbars are the browser's automatic overflow UI; hide them site-wide.
   Wheel, touch and keyboard scrolling keep working. */
html { scrollbar-width: none; }
html::-webkit-scrollbar { width: 0; height: 0; display: none; }

body {
  background: var(--paper);
  color: var(--black);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.35;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background-color .2s ease, color .2s ease;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px var(--pad-side);
  border-bottom: 1px solid var(--border);
}

.wordmark {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -.01em;
  line-height: 1;
  margin: 0;
  font-variation-settings: "wght" 700;
}
.wordmark em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-variation-settings: "wght" 400;
  letter-spacing: 0;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.wordmark-zh {
  margin: 0;
  color: var(--pigeon);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .3em;
}

.controls { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: flex-end; }

.tz, .lang { position: relative; }

.lang-pop { width: 210px; max-width: calc(100vw - 28px); }
.lang-pop .tz-list { overflow: auto; max-height: 60vh; scroll-padding-top: 0; }

.tz-btn { gap: 8px; }
.tz-btn .flag { margin-right: 0; }

.flag {
  width: 20px;
  height: 15px;
  object-fit: cover;
  border-radius: 2px;
  display: block;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12);
  flex: none;
}

.tz-pop {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: min(300px, calc(100vw - 28px));
  max-height: min(320px, 60vh);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--paper);
  z-index: 60;
  overflow: hidden;
}
/* the author display above would otherwise beat the UA [hidden] rule */
.tz-pop[hidden] { display: none; }

.tz-search {
  position: relative;
  z-index: 1;
  background: var(--paper);
  border: 0;
  border-bottom: 1px solid var(--border);
  color: inherit;
  padding: 10px 12px;
  font: inherit;
  font-size: 13px;
  outline: none;
}
.tz-search::placeholder { color: var(--pigeon); }

.tz-list {
  overflow: auto;
  padding: 0 4px;
  scrollbar-width: none;      /* scroll via wheel/touch; no visible bar */
  -ms-overflow-style: none;
  scroll-snap-type: y mandatory;   /* always settle on a clean row boundary */
  scroll-padding-top: 24px;        /* rows rest below the pinned region title */
}
.tz-list .tz-row { scroll-snap-align: start; }
.tz-list::-webkit-scrollbar { display: none; width: 0; height: 0; }

.tz-group {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 24px;
  display: flex;
  align-items: center;
  background: var(--paper);
  padding: 0 8px;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pigeon);
  font-weight: 550;
  font-variation-settings: "wght" 550;
}

.tz-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  text-align: start;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.tz-row[hidden] { display: none; }
.tz-row:hover { background: var(--notification); color: var(--on-notification); }

.tz-city {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  font-variation-settings: "wght" 500;
}

.tz-off {
  color: var(--pigeon);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.tz-row:hover .tz-off { color: inherit; }

.tz-win {
  border: 0;
  background: transparent;
  color: var(--pigeon);
  cursor: pointer;
  padding: 3px;
  border-radius: 4px;
  display: flex;
}
.tz-row:hover .tz-win { color: inherit; }
.tz-win:hover { outline: 1px solid currentColor; }

.btn {
  display: inline-flex;
  color: inherit;
  text-decoration: none;
  align-items: center;
  gap: 8px;
  min-height: var(--h-ctl);
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
}
.btn:hover { background: var(--notification); border-color: var(--notification); color: var(--on-notification); }
.btn:disabled { border-color: var(--pigeon); color: var(--pigeon); cursor: wait; background: transparent; }
.btn.is-busy .btn-dot { animation: pulse .9s infinite; }
.btn svg { display: block; }

.btn-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--notification);
}



/* ---------- world map overlay ---------- */
.topbar { position: relative; z-index: 80; background: var(--paper); }
.map-wrap {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.map-wrap[hidden] { display: none; }
.map-wrap svg { width: 100%; height: 100%; }
/* monochrome atlas: dark-grey landmasses, white country borders */
.map-cc { fill: #2e2e2e; stroke: #ffffff; stroke-width: .6; cursor: pointer; }
.map-cc.nozone { fill: #1f1f1f; cursor: default; }
.map-cc:not(.nozone):hover { stroke: var(--notification); stroke-width: 1; }
.map-cc.sel { stroke: var(--notification); stroke-width: 1.4; filter: brightness(1.25); }
.map-grat {
  fill: none;
  stroke: var(--pigeon);
  opacity: .22;
  stroke-width: .5;
  pointer-events: none;
}

/* ---------- wallet: balance · days · reports ---------- */
.walletmenu { position: relative; }
.wallet-pop {
  width: min(400px, calc(100vw - 28px));
  max-height: min(620px, 82vh);
  display: flex;
  flex-direction: column;
}
.wal-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.wal-head .meta-label { margin-bottom: 2px; }
.wal-bal {
  margin: 0;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: "wght" 600;
}
.wal-cur-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--h-field);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 9px;
  cursor: pointer;
}
.wal-cur-btn:hover { background: var(--paper-2); }
.wal-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.wal-seg { grid-column: 1 / -1; display: flex; }
.wal-seg button {
  flex: 1;
  min-height: var(--h-ctl);
  border: 1px solid var(--border);
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.wal-seg button:first-child { border-radius: 6px 0 0 6px; }
.wal-seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.wal-seg button[aria-pressed="true"] {
  background: var(--notification);
  border-color: var(--notification);
  color: var(--on-notification);
}
.wal-form input {
  min-height: var(--h-field);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 14px;
  padding: 6px 10px;
  outline: none;
  min-width: 0;
}
.wal-form input::placeholder { color: var(--pigeon); }
.wal-form input.bad { border-color: var(--notification); color: var(--notification); }
.wal-add { justify-content: center; }
.wal-tabs { display: flex; gap: 8px; padding: 12px 14px 4px; }
.wal-tab { flex: 1; justify-content: center; }
.wal-tab[aria-pressed="true"] {
  background: var(--notification);
  border-color: var(--notification);
  color: var(--on-notification);
}
.wal-body { overflow: hidden; padding: 8px 14px 14px; }
.wal-empty { color: var(--pigeon); font-size: 13px; padding: 10px 2px; margin: 0; }
.wal-day { margin-bottom: 12px; }
.wal-day-h {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 0 3px;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--pigeon);
  font-weight: 550;
  font-variation-settings: "wght" 550;
}
.wal-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 2px;
  font-size: 13px;
  border-top: 1px solid var(--paper-2);
}
.wal-note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wal-amt { font-variant-numeric: tabular-nums; font-weight: 500; }
.wal-amt.in { color: var(--pigeon); }
.wal-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: transparent;
  color: var(--pigeon);
  font: inherit;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  flex: none;
}
.wal-x:hover { color: var(--notification); border-color: var(--notification); }
.wal-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 10px; }
.wal-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 10px; min-width: 0; }
.wal-card strong {
  display: block;
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wal-lbl {
  margin: 0 0 2px;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pigeon);
  font-weight: 550;
}
.wal-week-lbl { margin: 2px 0 4px; }
.wal-chart { width: 100%; display: block; }
.wal-bar { fill: var(--pigeon); opacity: .55; }
.wal-bar.now { fill: var(--notification); opacity: 1; }
.wal-chart text { fill: var(--pigeon); font-size: 10px; text-anchor: middle; }
.wal-amt-wrap {
  display: flex;
  align-items: stretch;
  min-width: 0;
  min-height: var(--h-field);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.wal-amt-wrap:focus-within { border-color: var(--pigeon); }
.wal-amt-wrap:has(#walAmt.bad) { border-color: var(--notification); }
.wal-amt-sym {
  display: flex;
  align-items: center;
  padding-inline-start: 10px;
  color: var(--pigeon);
  font-size: 13px;
  pointer-events: none;
  flex: none;
}
#walAmt {
  flex: 1;
  min-width: 0;
  min-height: 0;
  border: 0;
  border-radius: 0;
  padding: 6px 10px;
  padding-inline-start: 6px;
}
.wal-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wal-field .wal-lbl { margin: 0; }
.wal-field-add { justify-content: flex-end; }
.wal-field-add .wal-add { width: 100%; }
.wal-date-btn {
  min-height: var(--h-field);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px;
  text-align: left;
  cursor: pointer;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wal-date-btn:hover { background: var(--paper-2); }
.wal-cal {
  grid-column: 1 / -1;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 8px;
}
.wal-cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.wal-cal-head strong { font-size: 13px; font-weight: 600; }
.wal-cal-nav {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  flex: none;
}
.wal-cal-nav:hover { background: var(--notification); color: var(--on-notification); border-color: var(--notification); }
.wal-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wal-cal-grid .dow {
  padding: 3px 0;
  text-align: center;
  color: var(--pigeon);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.wal-cal-day {
  min-height: 32px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.wal-cal-day:hover { background: var(--paper-2); }
.wal-cal-day.dim { color: var(--pigeon); opacity: .45; cursor: default; }
.wal-cal-day.today { box-shadow: inset 0 0 0 1px var(--border); }
.wal-cal-day.sel { background: var(--notification); color: var(--on-notification); }
.wal-cur-search {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: var(--paper);
  color: inherit;
  font: inherit;
  font-size: 13px;
  padding: 10px 12px;
  outline: none;
  margin: 0;
}
.wal-cur-search::placeholder { color: var(--pigeon); }
.wal-cur-list { max-height: 240px; overflow: auto; padding: 0 4px; scroll-snap-type: y mandatory; }
.wal-cur-list > * { scroll-snap-align: start; }
.cur-row.sel-cur { background: var(--paper-2); }

/* ---------- wallet as a full-page app ---------- */
.wallet-app {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  padding: 20px 14px 48px;
}
.wal-panel {
  width: min(720px, 100%);
  align-self: flex-start;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.wal-body-page { max-height: none; }

/* ---------- SinghoLaunch launchpad ---------- */
.launch {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px 16px;
}
.lp-clockwrap { text-align: center; }
.lp-clock {
  margin: 0;
  font-family: var(--font-sans);
  font-variation-settings: "wght" 350, "MONO" 100;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
  font-size: clamp(26px, 6vw, 42px);
  line-height: 1;
  letter-spacing: -.02em;
  direction: ltr;
  user-select: none;
}
.lp-clock .sep { color: var(--notification); }
.lp-clock .ms { color: var(--pigeon); }
.lp-clock-zone {
  margin: 6px 0 0;
  color: var(--pigeon);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.lp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  width: min(720px, 100%);
}
.lp-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  color: inherit;
  text-decoration: none;
}
.lp-card:hover { background: var(--notification); border-color: var(--notification); color: var(--on-notification); }
.lp-card strong { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.lp-sub { color: var(--pigeon); font-size: 13px; }
.lp-card:hover .lp-sub { color: inherit; }
.lp-offrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.lp-dial { width: clamp(96px, 24vw, 128px); aspect-ratio: 1; margin: 0 auto 12px; }
.lp-dial svg { width: 100%; height: 100%; display: block; }
.lp-tzwrap { position: relative; display: inline-block; }
.lp-zone-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px; padding: 4px 10px;
  border: 0; border-radius: 6px; background: transparent;
  color: var(--pigeon); cursor: pointer; font: inherit;
}
.lp-zone-btn:hover { color: var(--black); }
.lp-zone-btn .lp-clock-zone { margin: 0; }
.lp-tzwrap .tz-pop { right: auto; left: 50%; transform: translateX(-50%); }
@media (max-width: 560px) {
  .wal-form input, .wal-cur-search { font-size: 16px; }  /* prevents iOS focus zoom */
  .wal-seg button, .wal-tab { min-height: 40px; }
  .wal-bal { font-size: 23px; }
  .wal-item { padding: 9px 2px; }
  .wal-date-btn, .wal-cur-btn { min-height: 40px; }
  .wal-cal-day, .wal-cal-nav { min-height: 38px; }
  .wordmark-zh { letter-spacing: .2em; }
}

/* ---------- meta row: date + time above the clock ---------- */
.meta-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px var(--pad-side);
  border-bottom: 1px solid var(--border);
}

.meta-left,
.meta-right { min-width: 0; }

.meta-label {
  font-family: var(--font-sans);
  font-variation-settings: "wght" 550;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pigeon);
  margin: 0 0 3px;
}

.meta-value {
  margin: 0;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -.01em;
  font-variation-settings: "wght" 500;
  font-variant-numeric: tabular-nums;
}

.meta-right { text-align: right; }
.meta-right .meta-value { font-weight: 400; font-variation-settings: "wght" 400; }

/* ---------- the clock ---------- */
.clock-wrap {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* the clock grid: 1, side-by-side or 2×2 cells with hairline separators */
.grid {
  flex: 1;
  display: grid;
  width: 100%;
  min-height: 0;
  gap: 1px;
  background: var(--border);
}
.grid[data-layout="1"] { grid-template: 1fr / 1fr; gap: 0; background: transparent; }
.grid[data-layout="2"] { grid-template: 1fr / 1fr 1fr; }
.grid[data-layout="2x2"] { grid-template: 1fr 1fr / 1fr 1fr; }

.cell {
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-width: 0;
  min-height: 0;
  padding: 12px 20px;
  transition: background-color .2s ease;
}

.cell-cap {
  display: none;
  align-items: center;
  gap: 10px;
  margin: 0;
  color: var(--pigeon);
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 500;
  font-variation-settings: "wght" 500;
  cursor: pointer;
}
.zen .cell-cap, .multi .cell-cap { display: flex; }
.cell-cap { flex-wrap: wrap; justify-content: center; row-gap: 4px; }
.cell-cap .cap-zone { color: var(--black); }
.cell-cap .cap-time { color: var(--black); font-variant-numeric: tabular-nums; }
.cell.unset .clock { display: none; }
.cell.unset .cell-cap { visibility: hidden; }
.cell:not(.unset) .cell-add { display: none; }

.cell-add {
  border: 1px dashed var(--pigeon);
  color: var(--pigeon);
  border-radius: var(--radius-lg);
  padding: 10px 18px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: transparent;
}
.cell-add:hover { border-color: var(--notification); color: var(--notification); }

/* ---------- analog dial ---------- */
.dial { display: none; align-items: center; justify-content: center; }
.analog .cell .clock { display: none; }
.analog .cell:not(.unset) .dial { display: flex; }
.dial svg { width: 100%; height: 100%; display: block; }
.dial-rim { fill: none; stroke: var(--border); }
.dial-tick { stroke: var(--pigeon); opacity: .55; }
.dial-tick-h { stroke: var(--black); opacity: 1; }
.dial-num {
  fill: var(--pigeon);
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: .08em;
  text-anchor: middle;
  dominant-baseline: central;
  font-variation-settings: "wght" 500;
}
.dial-hand { stroke-linecap: round; }
.h-hour { stroke: var(--black); stroke-width: 4; }
.h-min { stroke: var(--black); stroke-width: 2.5; }
.h-sec { stroke: var(--notification); stroke-width: 1.6; }
.h-ms { stroke: var(--pigeon); stroke-width: 1; }
.dial-hub { fill: var(--black); }
.dial-hub2 { fill: var(--notification); }

/* ---------- timer ---------- */
.timermenu { position: relative; }
.timer-pop { width: 250px; max-width: calc(100vw - 28px); padding: 10px; }
.timer-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.timer-presets .btn { justify-content: center; padding: 6px 4px; }
.timer-custom { display: flex; gap: 8px; align-items: center; }
.timer-custom input {
  width: 64px;
  background: transparent;
  border: 1px solid var(--border);
  color: inherit;
  padding: 6px 8px;
  font: inherit;
  font-size: 13px;
  border-radius: 6px;
  outline: none;
}
.timer-min-label {
  flex: 1;
  color: var(--pigeon);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.cap-x, .cap-reset {
  display: none;
  align-items: center;
  justify-content: center;
  width: 18px; height: 18px;
  margin-left: 2px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: transparent;
  color: var(--pigeon);
  font: inherit;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}
.cap-x:hover, .cap-reset:hover { color: var(--notification); border-color: var(--notification); }
.cell.timer .cap-x, .cell.stop .cap-x { display: inline-flex; }
.cell.timer .flag, .cell.stop .flag { display: none; }
.cap-reset { display: none; }
.cell.stop .cap-reset { display: inline-flex; }

/* ---------- IP locator ---------- */
.ipmenu { position: relative; }
.ip-pop { width: 270px; max-width: calc(100vw - 28px); padding: 10px; }
.ip-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 2px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
  font-size: 14px;
  letter-spacing: .02em;
}
.ip-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; }
.ip-row span:first-child {
  color: var(--pigeon);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: 10.5px;
  padding-top: 2px;
  flex: none;
}
.ip-row span:last-child { text-align: right; min-width: 0; }
.ip-pop .btn { width: 100%; justify-content: center; margin-top: 6px; }
.cell.done .clock { color: var(--notification); }
.cell.done .clock .sep { animation: none; }

/* zen windows keep only the controls they need */
.zen .meta-row, .zen .status, .zen .wordmark,
.zen .winmenu, .zen #btnSync, .zen #btnFull { display: none; }

/* multi-cell mode in the main window: captions replace the header line */
.multi .meta-row { display: none; }

.layouts { display: none; gap: var(--gap); }
.zen .layouts { display: flex; }
.lay-btn { min-width: 34px; justify-content: center; padding: 4px 8px; }
.lay-btn[aria-pressed="true"] {
  background: var(--notification);
  border-color: var(--notification);
  color: var(--on-notification);
}

.winmenu { position: relative; }
.win-pop { width: 190px; max-width: calc(100vw - 28px); }

.clock {
  display: flex;
  align-items: baseline;
  justify-content: center;
  margin: 0;
  font-family: var(--font-sans);
  font-variation-settings: "wght" 350, "MONO" 100;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
  /* baseline before fitFontSize() measures the box; kept in sync with it */
  font-size: 12vw;
  line-height: .84;
  letter-spacing: -.02em;
  white-space: nowrap;
  user-select: none;
  /* HH:MM:SS:mmm always reads left-to-right, even in RTL languages */
  direction: ltr;
}

/* no padding here: the MONO axis already gives every glyph the same 0.6 em
   advance, and the slot widths have to stay identical or the clock jitters */
.clock .sep { color: var(--notification); }
.clock .ms { color: var(--pigeon); }

/* both colons blink in phase, re-triggered by the DOM update each second */
.clock .sep { animation: blink 1s steps(1, end) infinite; }
@keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: .3 } }
@media (prefers-reduced-motion: reduce) {
  .clock .sep { animation: none; }
}

/* ---------- status bar ---------- */
.status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  flex-wrap: wrap;
  padding: 12px var(--pad-side);
  border-top: 1px solid var(--border);
}

.status-right { min-width: 0; }

.status-group { display: flex; align-items: center; gap: var(--gap); min-width: 0; }

.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--pigeon);
  flex: none;
}
.status-dot[data-level="ok"]   { background: var(--notification); }
.status-dot[data-level="warn"] { background: var(--notification); }
.status-dot[data-level="off"]  { background: var(--pigeon); }

.status-text {
  font-size: 13px;
  font-weight: 500;
  font-variation-settings: "wght" 500;
  margin: 0;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-detail {
  font-family: var(--font-sans);
  font-variation-settings: "wght" 500;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--pigeon);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-right { display: flex; align-items: center; gap: 18px; }

.second-bar {
  position: relative;
  width: 180px;
  height: 5px;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  flex: none;
}
.second-bar span {
  position: absolute;
  inset: 0;
  background: var(--notification);
  transform: scaleX(0);
  transform-origin: left center;
  will-change: transform;
}

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .meta-right { text-align: left; }
  .second-bar { width: 110px; }
}
@media (max-width: 560px) {
  body { font-size: 14px; }
  .topbar, .meta-row, .status { padding-left: 14px; padding-right: 14px; }
  .meta-value { font-size: 17px; }
  .meta-row { flex-direction: column; gap: 8px; align-items: flex-start; }
  .status-right { gap: 10px; }
  .second-bar { width: 74px; }
}

/* ---------- phones: same anchored dropdowns, touch-first sizing ---------- */
@media (max-width: 560px) {
  .tz-row { padding: 12px 14px; }
  .tz-search { font-size: 16px; }   /* prevents iOS focus zoom */
  .btn { padding: 8px 12px; }
  .grid[data-layout="2"] { grid-template: 1fr 1fr / 1fr; }  /* stack on phones */
  .cell-cap { font-size: 11px; gap: 6px; }
  .clock .sep { animation-duration: 1s; }
}

/* mobile devices: the page itself may scroll; dropdown lists always may */
@media (pointer: coarse) {
  html, body { height: auto; overflow-y: auto; }
  body { min-height: 100vh; min-height: 100svh; }  /* status bar hugs the bottom when short */
  .wallet-app, .launch { overflow: visible; }
  .wal-body { overflow: visible; }
}

/* ---------- optional Google sign-in portal ---------- */
.authwrap { position: relative; display: flex; }
.auth-ava { width: 20px; height: 20px; border-radius: 50%; flex: none; }
.auth-pop {
  right: 0;
  width: min(260px, calc(100vw - 28px));
  padding: 12px;
  gap: 10px;
}
.auth-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.auth-head .auth-ava { width: 28px; height: 28px; }
.auth-head strong { font-size: 14px; font-weight: 600; display: block; }
.auth-mail { margin: 0; color: var(--pigeon); font-size: 12px; }
.auth-out { width: 100%; justify-content: center; }

/* ---------- SinghoSettings ---------- */
.settings {
  height: 100%;
  overflow-y: auto;
  padding: calc(var(--gap) * 2) var(--pad-side);
  scrollbar-width: none;
}
.settings::-webkit-scrollbar { display: none; width: 0; height: 0; }
.set-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: var(--gap);
  max-width: 1040px;
  margin: 0 auto;
}
.set-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.set-card .langwrap { align-self: flex-start; position: relative; }
.set-list {
  max-height: 264px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.set-note { margin: 0; color: var(--pigeon); font-size: 13px; line-height: 1.55; }
.set-danger { color: #b3261e; justify-content: center; }

/* ---------- wallet reports: six ranges ---------- */
.wal-seg6 { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.wal-seg6::-webkit-scrollbar { display: none; width: 0; height: 0; }
.wal-seg6 button { flex: 0 0 auto; padding: 0 12px; border-left: 0; border-radius: 0; }
.wal-seg6 button:first-child { border-radius: 6px 0 0 6px; border-left: 1px solid var(--border); }
.wal-seg6 button:last-child { border-radius: 0 6px 6px 0; }
.wal-repbar { display: flex; align-items: center; gap: var(--gap); }
.wal-repbar strong { flex: 1; text-align: center; font-size: 13px; font-weight: 600; }
.wal-bar.in { fill: var(--notification); opacity: .5; }
.lg { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--pigeon); margin: 0 6px 0 10px; }
.lg.in { background: var(--notification); opacity: .5; }

/* ============================================================
   Singhoah — core logic (runs in the browser *and* in node)
   Every function below is pure / dependency-injected so it can be
   exercised by test/app.test.mjs without a DOM.

/* ---------------- formatting ---------------- */

export const pad = (n, len = 2) => {
  const s = String(Math.floor(Math.abs(n)));

/* Intl formatters are expensive to build and cheap to reuse — one per key. */
const dtfCache = new Map();
const cachedDTF = (key, make) => {
  let f = dtfCache.get(key);
  if (!f) { f = make(); dtfCache.set(key, f); }
  return f;
};

export const timeFormatter = (timeZone) => cachedDTF(`t|${timeZone}`, () =>
  new Intl.DateTimeFormat('en-GB', {
    timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit',
    hourCycle: 'h23', fractionalSecondDigits: 3,
  }));

/** Split a millisecond timestamp into the parts the display needs.
    With a timeZone, hours/minutes/seconds come from that zone; the
    millisecond-within-the-second is the same instant everywhere. */
export function toSegments(date, timeZone) {
  const ms = pad(date.getMilliseconds(), 3);
  if (!timeZone) {
    return { hh: pad(date.getHours()), mm: pad(date.getMinutes()), ss: pad(date.getSeconds()), ms };
  }
  const parts = timeFormatter(timeZone).formatToParts(date);
  const get = (t) => {
    const p = parts.find((x) => x.type === t);
    return p ? p.value : '00';
  };
  const hh = get('hour') === '24' ? '00' : get('hour');
  return { hh, mm: get('minute'), ss: get('second'), ms: get('fractionalSecond').slice(0, 3).padEnd(3, '0') };
}

/** "14:05:09:007" — HH:MM:SS:mmm */
export function formatClock(date, timeZone) {
  const s = toSegments(date, timeZone);
  return `${s.hh}:${s.mm}:${s.ss}:${s.ms}`;
}

/* The big display is built from these alternating runs:
   hh : mm : ss : mmm                                         */
export const SEGMENT_SHAPE = [
  ['hh', 2, 'digit'],
  ['sep', 1, 'sep'],
  ['mm', 2, 'digit'],
  ['sep', 1, 'sep'],
  ['ss', 2, 'digit'],
  ['sep', 1, 'sep'],
  ['ms', 3, 'ms'],
];

/** ['1','4',':','0','5',':','0','9',':','0','0','7'] */
/** hh/mm/ss/ms parts of a countdown duration, clamped at 99:59:59.999. */
export function timerSegments(ms) {
  const t = Math.max(0, Math.floor(ms));
  return {
    hh: pad(Math.min(Math.floor(t / 3600000), 99)),
    mm: pad(Math.floor(t / 60000) % 60),
    ss: pad(Math.floor(t / 1000) % 60),
    ms: pad(t % 1000, 3),
  };
}

const segDigits = (s) => {
  const out = [];
  for (const [key, len] of SEGMENT_SHAPE) {
    const v = key === 'sep' ? ':' : s[key];
    for (let i = 0; i < len; i++) out.push(v[i]);
  }
  return out;
};

export function toDigits(date, timeZone) {
  return segDigits(toSegments(date, timeZone));
}

export const DIGIT_KIND = SEGMENT_SHAPE.flatMap(([, len, kind]) =>
  Array.from({ length: len }, () => kind),
);

/**
 * In Saans with MONO=100 every glyph we render — digits, colon and period —
 * advances exactly 600/1000 em (verified against the font's hmtx table), so the
 * whole HH:MM:SS:mmm string is 12 × 0.6 em wide. That makes the clock fit any
 * viewport with one multiplication instead of a measurement round trip.
 */
export const MONO_ADVANCE = 0.6;
export const LETTER_SPACE_EM = 0.02; // mirrors .clock { letter-spacing: -.02em } in styles.css
export const CLOCK_GLYPHS = SEGMENT_SHAPE.reduce((n, [, len]) => n + len, 0); // 12
// effective width of the whole string in em: 12 × (0.6 advance − 0.02 letter-spacing)
export const CLOCK_EMS = 6.96;

const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December',
];

export function formatDateLong(date, opts = {}) {
  const locale = opts.locale || 'en-GB';
  try {
    return cachedDTF(`d|${locale}|${opts.timeZone || ''}`, () => new Intl.DateTimeFormat(locale, {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: opts.timeZone,
    })).format(date);
  } catch {
    return `${WD[date.getDay()]} ${date.getDate()} ${MO[date.getMonth()]} ${date.getFullYear()}`;
  }
}

export function formatTimeShort(date, opts = {}) {
  const locale = opts.locale || 'en-GB';
  try {
    return cachedDTF(`s|${locale}|${opts.timeZone || ''}`, () => new Intl.DateTimeFormat(locale, {
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: opts.timeZone,
    })).format(date);
  } catch {
    return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }
}

export function zoneInfo(date = new Date(), timeZone) {
  const tz = timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  let abbr = '';
  try {
    abbr = cachedDTF(`a|${tz}`, () => new Intl.DateTimeFormat('en-US', {
      timeZone: tz, timeZoneName: 'short',
    })).formatToParts(date).find((p) => p.type === 'timeZoneName')?.value ?? '';
  } catch { /* ignore */ }
  let minutes = null;
  try {
    const gmt = cachedDTF(`o|${tz}`, () => new Intl.DateTimeFormat('en-US', {
      timeZone: tz, timeZoneName: 'longOffset',
    })).formatToParts(date).find((p) => p.type === 'timeZoneName')?.value ?? '';
    const m = gmt.match(/GMT([+-])(\d{2}):(\d{2})/);
    minutes = m ? (m[1] === '-' ? -1 : 1) * (Number(m[2]) * 60 + Number(m[3])) : 0;
  } catch { /* ignore */ }
  if (minutes === null) minutes = -date.getTimezoneOffset();
  const sign = minutes < 0 ? '−' : '+';
  const abs = Math.abs(minutes);
  const utc = `UTC${sign}${pad(Math.floor(abs / 60))}:${pad(abs % 60)}`;
  return { tz, abbr, utc, minutes };
}

/** Every IANA zone the runtime knows about (400+), with a sane fallback. */
export function allTimeZones() {
  try {
    if (typeof Intl.supportedValuesOf === 'function') {
      const list = [...Intl.supportedValuesOf('timeZone')];
      // ICU lists Etc/UTC but not the plain "UTC" alias — a clock must offer it
      if (!list.includes('UTC')) list.unshift('UTC');
      if (Array.isArray(list) && list.length) return list;
    }
  } catch { /* ignore */ }
  return FALLBACK_ZONES;
}

  z.indexOf('/') === -1 ? z : z.slice(z.indexOf('/') + 1).replace(/_/g, ' ');

export const regionOf = (z) =>

export const GLOBE_SVG = `data:image/svg+xml,${encodeURIComponent(

)}`;

/** ISO 3166-1 alpha-2 for a zone, or null (unknown zones). */
export function zoneCountry(tz) {
  const m = globalThis.__SINGHOAH_FLAGS;
  return (m && m.zoneCc && m.zoneCc[tz]) || null;
}

/** Flag image for an ISO country code; the globe only for unknown codes. */
export function ccFlag(cc) {
  const m = globalThis.__SINGHOAH_FLAGS;
  return (m && cc && m.png[cc]) || GLOBE_SVG;
}

/** Flag image for a zone, via its country. */
export function flagSrc(tz) {
  return ccFlag(zoneCountry(tz));
}

/** Tiny formatter: t('es', 'synced', { src: 'x' }) -> 'Sincronizado · x' */
export function t(lang, key, vars = {}) {
  const table = STRINGS[lang] || STRINGS.en;
  const raw = table[key] ?? STRINGS.en[key] ?? key;
  return raw.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
}

export const langOf = (id) => LANGS.find((l) => l.id === id) || LANGS[0];

/* ---------------- wallet math (pure, unit-tested) ---------------- */

/** Balance = income in minus spending out. */
export function walBalance(tx) {
  let b = 0;
  for (const x of tx) b += x.type === 'in' ? x.amt : -x.amt;
  return Math.round(b * 100) / 100;
}

/** Group transactions per day: date -> { spent, income, items[] }. */
export function walByDay(tx) {
  const m = new Map();
  for (const x of tx) {
    let d = m.get(x.date);
    if (!d) { d = { spent: 0, income: 0, items: [] }; m.set(x.date, d); }
    if (x.type === 'out') d.spent += x.amt; else d.income += x.amt;
    d.items.push(x);
  }
  for (const d of m.values()) {
    d.spent = Math.round(d.spent * 100) / 100;
    d.income = Math.round(d.income * 100) / 100;
  }
  return m;
}

/** Month-to-date dashboard figures for `today` (YYYY-MM-DD). */
export function walMonthStats(tx, today) {
  const mo = today.slice(0, 7);
  let spent = 0, income = 0, top = null;
  const days = new Set();
  for (const x of tx) {
    if (typeof x.date !== 'string' || !x.date.startsWith(mo)) continue;
    if (x.type === 'out') { spent += x.amt; days.add(x.date); if (!top || x.amt > top.amt) top = x; }
    else income += x.amt;
  }
  const elapsed = Number(today.slice(8, 10)) || 1;
  return {
    spent: Math.round(spent * 100) / 100,
    income: Math.round(income * 100) / 100,
    avg: Math.round((spent / elapsed) * 100) / 100,
    top,
  };
}

/** Spending per day over the seven days ending at `today`. */
export function walWeekSeries(tx, today) {
  const per = new Map();
  for (const x of tx) if (x.type === 'out') per.set(x.date, (per.get(x.date) || 0) + x.amt);
  const base = new Date(`${today}T00:00:00`);
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base);
    d.setDate(base.getDate() - i);
    const ymd = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    out.push({ date: ymd, spent: Math.round((per.get(ymd) || 0) * 100) / 100 });
  }
  return out;
}

/** Elapsed ms of a stopwatch at nowMs (pure, unit-testable). */
export function stopwatchElapsed(st, nowMs) {
  return st.accum + (st.running ? Math.max(0, nowMs - st.startedAt) : 0);

export function anglesFromSegments(s) {
  const ms = Number(s.ms);
  const secF = Number(s.ss) + ms / 1000;
  const minF = Number(s.mm) + secF / 60;
  const hourF = (Number(s.hh) % 12) + minF / 60;
  return { hour: hourF * 30, minute: minF * 6, second: secF * 6, milli: ms * 0.36 };
}

/* ---------------- NTP-ish synchronisation ---------------- */

export const NTP_SOURCES = [
  {
    // ~50 ms round trip, millisecond resolution in the payload
    name: 'timeapi.io',
    url: 'https://timeapi.io/api/time/current/zone?timeZone=UTC',
    parse: (j) => Date.parse(String(j.dateTime).endsWith('Z') ? j.dateTime : j.dateTime + 'Z'),
  },
  {
    // fallback: any fast CORS-enabled CDN answers with an RFC 7231 Date header.
    // 1 s resolution, so compensate for the truncation (+500 ms) and mark it
    // coarse — it is only trusted when no millisecond-resolution source answers.
    name: 'jsdelivr Date header',
    url: 'https://cdn.jsdelivr.net/npm/left-pad@1.3.0/package.json',
    header: 'date',
    coarse: true,
    parse: (_j, res) => Date.parse(res.headers.get('date')) + 500,
  },
];

/** True when the source's own timestamp granularity limits its accuracy. */
export const isCoarse = (source) => Boolean(source && source.coarse);

/**
 * One sample against one endpoint, using the symmetric latency correction
 * from NTP: offset = serverTime + rtt/2 − localReceiveTime.
 */
export async function sampleNtp(source, deps = {}) {
  const fetchFn = deps.fetch || globalThis.fetch;
  const now = deps.now || (() => Date.now());
  const t0 = now();
  let res;
  try {
    res = await fetchFn(source.url, { cache: 'no-store', signal: deps.signal });
  } catch (e) {
    return { ok: false, source: source.name, error: String(e) };
  }
  const t1 = now();
  if (!res) return { ok: false, source: source.name, error: 'no response' };

  // Date-header sources only need the headers — the body/status is irrelevant.
  if (!source.header && !res.ok) {
    return { ok: false, source: source.name, error: `HTTP ${res.status}` };
  }

  let json = null;
  if (!source.header) {
    try {
      json = await res.json();
    } catch (e) {
      return { ok: false, source: source.name, error: String(e) };
    }
  }
  let serverNow;
  try {
    serverNow = source.parse(json, res);
  } catch (e) {
    return { ok: false, source: source.name, error: String(e) };
  }
  if (!Number.isFinite(serverNow)) return { ok: false, source: source.name, error: 'unparsable time' };
  const rtt = t1 - t0;
  return {
    ok: true,
    source: source.name,
    coarse: Boolean(source.coarse),
    rtt,
    offset: Math.round(serverNow + rtt / 2 - t1),
    at: t1,
  };
}

const median = (xs) => {
  const a = [...xs].sort((x, y) => x - y);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
};

/**
 * Keep the low-latency samples, drop the rest, take the median offset.
 * Coarse (second-resolution) sources are only used when nothing finer answered.
 */
export function pickNtpResult(samples, opts = {}) {
  const maxRtt = opts.maxRtt ?? 900;
  let good = (samples || []).filter((s) => s && s.ok && s.rtt <= maxRtt);
  if (!good.length) return null;

  const precise = good.filter((s) => !s.coarse);
  let resolution = 'millisecond';
  if (precise.length) good = precise;
  else resolution = 'second';

  const offset = median(good.map((s) => s.offset));
  const best = good.reduce((a, b) => (b.rtt < a.rtt ? b : a));
  return {
    ok: true,
    source: best.source,
    resolution,
    offset,
    rtt: best.rtt,
    spread: Math.max(...good.map((s) => s.offset)) - Math.min(...good.map((s) => s.offset)),
    samples: good.length,
    at: best.at,
  };
}

export function syncStatus(result, opts = {}) {
  const driftLimit = opts.driftLimit ?? 250;
  const lang = opts.lang || 'en';
  if (!result || !result.ok) {
    return { level: 'off', label: t(lang, 'offLabel'), detail: t(lang, 'offDetail') };
  }
  const o = result.offset;
  const sign = o < 0 ? '−' : '+';
  const mag = `${sign}${Math.abs(o)} ms`;
  const res = result.resolution === 'second' ? t(lang, 'secondRes') : '';
  const vars = { src: result.source, mag, res };
  if (Math.abs(o) <= driftLimit) {
    return { level: 'ok', label: t(lang, 'synced', vars), detail: t(lang, 'drift', vars) };
  }
  return { level: 'warn', label: t(lang, 'corrected', vars), detail: t(lang, 'drift', vars) };
}

/* ---------------- the ticking clock ---------------- */

/**
 * Owns "what time is it right now" (system clock + measured drift) and the
 * render loop. `deps` lets the tests drive it with fake time and a fake rAF.
 */
export class ClockCore {
  constructor(deps = {}) {
    this.nowFn = deps.now || (() => Date.now());
    this.schedule = deps.schedule || ((fn) => requestAnimationFrame(fn));
    this.onTick = deps.onTick || (() => {});
    this.offset = 0;
    this._running = false;
    this.start();
  }

  get running() { return this._running; }

  /** Time the display should show: local system time, drift-corrected. */
  now() { return new Date(this.nowFn() + this.offset); }

  setOffset(ms) {
    this.offset = Number.isFinite(ms) ? Math.round(ms) : 0;
    this.onTick(this.now());
  }

  start() {
    if (this._running) return;
    this._running = true;
    const step = () => {
      if (!this._running) return;
      this.onTick(this.now());
      this.schedule(step);
    };
    step();
  }

  stop() { this._running = false; }
}

/**
 * Largest font size for which the clock still fits, given a box in CSS px.
 * Width: the string is CLOCK_EMS em wide. Height: line-height is .84, and we
 * leave a little air so the descenderless digits never touch the rules.
 */
export function fitFontSize(w, h, opts = {}) {
  const padX = opts.padX ?? 0;
  const padY = opts.padY ?? 0;
  const lineBox = opts.lineBox ?? 0.84;
  const max = opts.max ?? 340;
  const byWidth = (w - padX) / CLOCK_EMS;
  const byHeight = (h - padY) / lineBox;
  return Math.max(12, Math.floor(Math.min(byWidth, byHeight, max) * 100) / 100);
}

/** Hairline displaay-style dial: rim, 60 ticks, 12/3/6/9 and four hands. */
function makeDial() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 200 200');
  const el = (name, attrs, cls) => {
    const n = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
    if (cls) n.setAttribute('class', cls);
    n.setAttribute('vector-effect', 'non-scaling-stroke');
    return n;
  };
  svg.appendChild(el('circle', { cx: 100, cy: 100, r: 97 }, 'dial-rim'));
  for (let i = 0; i < 60; i++) {
    const hour = i % 5 === 0;
    const a = (i * 6) * Math.PI / 180;
    const r1 = 94;
    const r2 = hour ? 85 : 90;
    svg.appendChild(el('line', {
      x1: 100 + r1 * Math.sin(a), y1: 100 - r1 * Math.cos(a),
      x2: 100 + r2 * Math.sin(a), y2: 100 - r2 * Math.cos(a),
    }, hour ? 'dial-tick dial-tick-h' : 'dial-tick'));
  }
  for (const [txt, x, y] of [['12', 100, 27], ['3', 173, 100], ['6', 100, 173], ['9', 27, 100]]) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('class', 'dial-num');
    t.textContent = txt;
    svg.appendChild(t);
  }
  const hand = (cls, y1, y2, name) => {
    const l = el('line', { x1: 100, y1, x2: 100, y2 }, `dial-hand ${cls}`);
    l.dataset.hand = name;
    return l;
  };
  const hands = {
    hour: hand('h-hour', 112, 55, 'hour'),
    minute: hand('h-min', 114, 38, 'minute'),
    second: hand('h-sec', 120, 30, 'second'),
    milli: hand('h-ms', 116, 24, 'milli'),

  svg.appendChild(el('circle', { cx: 100, cy: 100, r: 1.8 }, 'dial-hub2'));
  return { svg, hands };
}

  const dspan = document.createElement('span');
  dspan.className = 'cap-date';
  if (withIds) dspan.id = 'zenDate';
  const sep2 = document.createElement('span');
  sep2.className = 'zen-sep';
  sep2.setAttribute('aria-hidden', 'true');
  sep2.textContent = '—';
  const tspan = document.createElement('span');
  tspan.className = 'cap-time';
  const rbtn = document.createElement('button');
  rbtn.type = 'button';
  rbtn.className = 'cap-reset';
  rbtn.textContent = '↺';
  rbtn.addEventListener('click', (e) => { e.stopPropagation(); resetStop(i); });
  const xbtn = document.createElement('button');
  xbtn.type = 'button';
  xbtn.className = 'cap-x';
  xbtn.textContent = '×';
  xbtn.addEventListener('click', (e) => { e.stopPropagation(); clearSessionCell(i); });
  cap.append(flag, zspan, sep, dspan, sep2, tspan, rbtn, xbtn);
  cap.addEventListener('click', () => capClick(i));

  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'cell-add';
  add.textContent = `+ ${t(lang, 'addZone')}`;
  add.addEventListener('click', () => openPickerFor(i));

  const clock = document.createElement('p');
  clock.className = 'clock';
  if (withIds) clock.id = 'clock';
  DIGIT_KIND.forEach((kind) => {
    const span = document.createElement('span');
    span.className = kind === 'ms' ? 'ms' : kind === 'sep' ? 'sep' : 'digit';
    clock.appendChild(span);
  });

  const { svg: dialSvg, hands } = makeDial();
  const dial = document.createElement('div');
  dial.className = 'dial';
  dial.appendChild(dialSvg);

  el.append(cap, add, clock, dial);
  return { el, cap, flag, zspan, dspan, tspan, rbtn, xbtn, sep, add, clock, dial, hands, prev: null, capKey: null };
}

function cellZone(i) {
  return i === 0 ? timeZone : cellZones[i];
}

function buildCells() {
  els.grid.textContent = '';
  els.grid.dataset.layout = layoutShape(layout).id;
  cells = [];
  for (let i = 0; i < layout; i++) {
    const cell = makeCell(i);
    els.grid.appendChild(cell.el);
    cells.push(cell);
  }
  refreshCellStates();
  fitClock();
}

function refreshCellStates() {
  cells.forEach((cell, i) => {
    const z = cellZone(i);
    cell.el.classList.toggle('unset', !z);
    cell.el.classList.toggle('timer', isTimer(z));
    cell.el.classList.toggle('stop', isStop(z));
    if (!z) { cell.prev = null; cell.capKey = null; }
  });
}

const durationLabel = (ms) => {
  const m = Math.floor(ms / 60000);
  const s = Math.floor(ms / 1000) % 60;
  return m >= 60 ? `${Math.floor(m / 60)}:${pad(m % 60)}:${pad(s)}` : `${m}:${pad(s)}`;
};

function updateTimerCell(cell, tm, date) {
  const remaining = tm.running ? tm.endsAt - date.getTime() : tm.remaining;
  const doneAt = remaining <= 0;
  if (doneAt && tm.running) { tm.running = false; tm.remaining = 0; }
  const seg = timerSegments(remaining);
  const digits = segDigits(seg);
  for (let k = 0; k < digits.length; k++) {
    if (!cell.prev || cell.prev[k] !== digits[k]) cell.clock.children[k].textContent = digits[k];
  }
  cell.prev = digits;
  cell.el.classList.toggle('done', doneAt);
  cell.zspan.textContent = t(lang, 'timer');
  cell.dspan.textContent = durationLabel(tm.duration);
  cell.tspan.textContent = doneAt ? t(lang, 'done') : t(lang, tm.running ? 'running' : 'paused');
  if (document.documentElement.classList.contains('analog')) {
    const a = anglesFromSegments(seg);
    cell.hands.hour.setAttribute('transform', `rotate(${a.hour} 100 100)`);
    cell.hands.minute.setAttribute('transform', `rotate(${a.minute} 100 100)`);
    cell.hands.second.setAttribute('transform', `rotate(${a.second} 100 100)`);
    cell.hands.milli.setAttribute('transform', `rotate(${a.milli} 100 100)`);
  }
}

function updateStopCell(cell, st, date) {
  const seg = timerSegments(stopwatchElapsed(st, date.getTime()));
  const digits = segDigits(seg);
  for (let k = 0; k < digits.length; k++) {
    if (!cell.prev || cell.prev[k] !== digits[k]) cell.clock.children[k].textContent = digits[k];
  }
  cell.prev = digits;
  cell.zspan.textContent = t(lang, 'stopwatch');
  cell.dspan.textContent = durationLabel(stopwatchElapsed(st, date.getTime()));
  cell.tspan.textContent = t(lang, st.running ? 'running' : 'paused');
  if (document.documentElement.classList.contains('analog')) {
    const a = anglesFromSegments(seg);
    cell.hands.hour.setAttribute('transform', `rotate(${a.hour} 100 100)`);
    cell.hands.minute.setAttribute('transform', `rotate(${a.minute} 100 100)`);
    cell.hands.second.setAttribute('transform', `rotate(${a.second} 100 100)`);
    cell.hands.milli.setAttribute('transform', `rotate(${a.milli} 100 100)`);
  }
}

function updateCell(cell, i, date, locale) {
  const z = cellZone(i);
  if (!z) return;
  if (isTimer(z)) {
    const tm = timers.get(z.slice(6));
    if (tm) updateTimerCell(cell, tm, date);
    return;
  }
  if (isStop(z)) {
    const st = stops.get(z.slice(5));
    if (st) updateStopCell(cell, st, date);
    return;
  }
  const digits = toDigits(date, z);
  for (let k = 0; k < digits.length; k++) {
    if (!cell.prev || cell.prev[k] !== digits[k]) cell.clock.children[k].textContent = digits[k];
  }
  cell.prev = digits;
  const key = `${z}|${Math.floor(date.getTime() / 60000)}`;
  if (key !== cell.capKey) {
    cell.capKey = key;
    cell.flag.src = flagSrc(z);
    cell.zspan.textContent = z;
    cell.dspan.textContent = formatDateLong(date, { timeZone: z, locale });
    cell.tspan.textContent = `${formatTimeShort(date, { timeZone: z, locale })} ${zoneInfo(date, z).abbr}`.trim();
  }
}

/** Keep every clock as large as its cell allows, on every resize/rotate. */
function fitClock() {
  for (const cell of cells) {
    const box = cell.el.getBoundingClientRect();
    const capH = (zenMode || layout > 1) ? cell.cap.offsetHeight + 14 : 0;
    const size = fitFontSize(box.width, box.height - capH, { padX: 24, padY: 8 });
    cell.clock.style.fontSize = `${size}px`;
    const side = Math.max(96, Math.floor(Math.min(box.width, box.height - capH) - 28));
    cell.dial.style.width = `${side}px`;
    cell.dial.style.height = `${side}px`;
  }
}

function renderMeta(date) {
  const locale = langOf(lang).locale;
  const zone = zoneInfo(date, timeZone);
  els.dateLong.textContent = formatDateLong(date, { timeZone, locale });
  els.dateTime.textContent = `${formatTimeShort(date, { timeZone, locale })} ${zone.abbr}`;
  els.zoneText.textContent = `${zone.tz} · ${zone.utc}`;
  // picker button follows the selection
  els.tzFlag.src = flagSrc(zone.tz);
  els.tzLabel.textContent = cityOf(zone.tz);
}

/** Meta text only changes once a minute (or on zone change) — skip otherwise. */
function maybeRenderMeta(date) {
  const key = `${timeZone}|${Math.floor(date.getTime() / 60000)}`;
  if (key === lastMetaKey) return;
  lastMetaKey = key;
  renderMeta(date);
}

export function render(date) {
  const locale = langOf(lang).locale;
  const analog = document.documentElement.classList.contains('analog');
  cells.forEach((cell, i) => {
    updateCell(cell, i, date, locale);
    if (analog && cellZone(i) && !isSession(cellZone(i))) {
      const a = handAngles(date, cellZone(i));
      cell.hands.hour.setAttribute('transform', `rotate(${a.hour} 100 100)`);
      cell.hands.minute.setAttribute('transform', `rotate(${a.minute} 100 100)`);
      cell.hands.second.setAttribute('transform', `rotate(${a.second} 100 100)`);
      cell.hands.milli.setAttribute('transform', `rotate(${a.milli} 100 100)`);
    }
  });
  maybeRenderMeta(date);
  const progress = (date.getSeconds() * 1000 + date.getMilliseconds()) / 60000;
  els.secondFill.style.transform = `scaleX(${progress.toFixed(4)})`;
}

function refreshURL() {
  const u = new URL(location.href);
  const shape = layoutShape(layout).id;
  const zen = zenMode ? '&zen=1' : '';
  if (layout === 1) {
    u.search = `?tz=${encodeURIComponent(timeZone || 'UTC')}${zen}`;
  } else {
    const zones = Array.from({ length: layout }, (_, i) => (isSession(cellZone(i)) ? '' : cellZone(i) || ''));
    u.search = `?tz=${encodeURIComponent(timeZone || 'UTC')}&layout=${shape}`
      + `&zones=${zones.map((z) => encodeURIComponent(z)).join(',')}${zen}`;
  }
  history.replaceState(null, '', u);
}

function setTimeZone(tz, persist = true) {
  timeZone = tz || null;
  markMapSel();
  if (zenMode) cellZones[0] = timeZone;
  lastMetaKey = null;
  prev = null;
  if (persist && !zenMode) {
    try { localStorage.setItem('singhoah:tz', tz || ''); } catch { /* ignore */ }
  }
  refreshCellStates();
  persistLayout();
  refreshURL();
  if (window.__clock) render(window.__clock.now());
}

function setCellZone(i, z) {
  if (i === 0) { setTimeZone(z, !zenMode); return; }
  cellZones[i] = z;
  refreshCellStates();
  persistLayout();
  refreshURL();
  if (window.__clock) render(window.__clock.now());
}

function setLayout(n) {
  layout = n;
  const keep = [timeZone, ...cellZones.slice(1)];
  cellZones = Array.from({ length: n }, (_, i) => keep[i] ?? null);
  document.documentElement.classList.toggle('multi', n > 1);
  document.querySelectorAll('.lay-btn').forEach((b) =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.layout) === n)));
  buildCells();
  persistLayout();
  refreshURL();
}

/** Remember format + zones so a reload restores the window (main app only). */
function persistLayout() {
  if (zenMode) return;
  try {
    localStorage.setItem('singhoah:layout', String(layout));
    localStorage.setItem('singhoah:zones', JSON.stringify(cellZones.map((z) => (isSession(z) ? null : z))));
  } catch { /* ignore */ }
}

/** A countdown joins the current window exactly like a zone pane does. */
function addTimerToWindow(ms) {
  const id = `t${++timerSeq}`;
  const now = (window.__clock ? window.__clock.now() : new Date()).getTime();
  timers.set(id, { duration: ms, endsAt: now + ms, remaining: ms, running: true });
  const shown = Array.from({ length: layout }, (_, i) => cellZone(i));
  let slot = shown.indexOf(null);
  if (slot === -1 && layout < 4) {
    setLayout(layout === 1 ? 2 : 4);
    slot = Array.from({ length: layout }, (_, i) => cellZone(i)).indexOf(null);
  }
  if (slot === -1) slot = layout - 1;
  setCellZone(slot, `timer:${id}`);
}

/** The Stopwatch button drops a counting-up pane into the current window. */
function addStopwatchToWindow() {
  const id = `s${++stopSeq}`;
  const now = (window.__clock ? window.__clock.now() : new Date()).getTime();
  stops.set(id, { startedAt: now, accum: 0, running: true });
  const shown = Array.from({ length: layout }, (_, i) => cellZone(i));
  let slot = shown.indexOf(null);
  if (slot === -1 && layout < 4) {
    setLayout(layout === 1 ? 2 : 4);
    slot = Array.from({ length: layout }, (_, i) => cellZone(i)).indexOf(null);
  }
  if (slot === -1) slot = layout - 1;
  setCellZone(slot, `stop:${id}`);
}

function toggleStop(i, z) {
  const st = stops.get(z.slice(5));
  if (!st) return;
  const now = (window.__clock ? window.__clock.now() : new Date()).getTime();
  if (st.running) {
    st.accum = stopwatchElapsed(st, now);
    st.running = false;
  } else {
    st.startedAt = now;
    st.running = true;
  }
  if (window.__clock) render(window.__clock.now());
}

function resetStop(i) {
  const z = cellZone(i);
  if (!isStop(z)) return;
  const st = stops.get(z.slice(5));
  if (!st) return;
  const now = (window.__clock ? window.__clock.now() : new Date()).getTime();
  st.startedAt = now;
  st.accum = 0;
  if (window.__clock) render(window.__clock.now());
}

function toggleTimer(i, z) {
  const tm = timers.get(z.slice(6));
  if (!tm) return;
  const now = (window.__clock ? window.__clock.now() : new Date()).getTime();
  if (tm.running) {
    tm.remaining = Math.max(0, tm.endsAt - now);
    tm.running = false;
  } else if (tm.remaining > 0) {
    tm.endsAt = now + tm.remaining;
    tm.running = true;
  }
  if (window.__clock) render(window.__clock.now());
}

function clearSessionCell(i) {
  const z = cellZone(i);
  if (isTimer(z)) timers.delete(z.slice(6));
  if (isStop(z)) stops.delete(z.slice(5));
  setCellZone(i, null);
}

function capClick(i) {
  const z = cellZone(i);
  if (isTimer(z)) toggleTimer(i, z);
  else if (isStop(z)) toggleStop(i, z);
  else openPickerFor(i);
}

/** ⧉ on a picker row: the zone joins the current window — no new tabs.
    Fills the first empty cell, growing 1→2→4 when needed; a full 2×2
    replaces the last cell. */
function addZoneToWindow(z) {
  const shown = Array.from({ length: layout }, (_, i) => cellZone(i));
  if (shown.includes(z)) return;
  let slot = shown.indexOf(null);
  if (slot === -1 && layout < 4) {
    setLayout(layout === 1 ? 2 : 4);
    slot = Array.from({ length: layout }, (_, i) => cellZone(i)).indexOf(null);
  }
  if (slot === -1) slot = layout - 1;
  setCellZone(slot, z);
}

function buildLangPicker() {
  for (const L of LANGS) {
    const row = document.createElement('div');
    row.className = 'tz-row';
    row.setAttribute('role', 'option');
    row.dataset.lang = L.id;

    img.src = ccFlag(L.flag);

    name.className = 'tz-city';
    name.textContent = L.name;
    row.append(img, name);
    row.addEventListener('click', () => { applyLang(L.id); closeLangPop(); els.langBtn.focus(); });
