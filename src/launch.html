<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SinghoLaunch — launchpad</title>
<meta name="description" content="Launchpad for the Singhoah app family: clock and wallet.">
<meta name="color-scheme" content="dark light">
<script>
  try { if ((localStorage.getItem('singhoah:night') || '1') === '1') document.documentElement.classList.add('dark'); }
  catch (e) { document.documentElement.classList.add('dark'); }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2f0e6'/%3E%3Crect x='5' y='5' width='9' height='9' rx='2' fill='%23000dff'/%3E%3Crect x='18' y='5' width='9' height='9' rx='2' fill='none' stroke='%23000' stroke-width='2'/%3E%3Crect x='5' y='18' width='9' height='9' rx='2' fill='none' stroke='%23000' stroke-width='2'/%3E%3Crect x='18' y='18' width='9' height='9' rx='2' fill='%23000dff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-app="launch">

<header class="topbar">
  <div class="brand"><p class="wordmark">S<em>ingho</em>Launch</p></div>
  <div class="controls">
    <div class="langwrap">
      <button type="button" class="btn tz-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" title="Language · 語言">
        <img id="langFlag" class="flag" alt="" width="20" height="15">
        <span id="langLabel">EN</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <div class="tz-pop lang-pop" id="langPop" hidden>
        <div class="tz-list" id="langList" role="listbox" aria-label="Language"></div>
      </div>
    </div>
    <button type="button" class="btn" id="btnNight" aria-pressed="false" title="Toggle night shift (N)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M21.8577 15.9125C20.4575 16.5686 18.8663 16.8635 17.2164 16.6901C12.3885 16.1826 8.88611 11.8575 9.39354 7.02959C9.56355 5.50838 10.1889 3.87875 11.1249 2.64375C7.31883 3.87875 4.64062 7.40498 4.64062 11.5489C4.64062 16.7938 8.88611 21.0489 14.1231 21.0489C17.1979 21.0489 19.9435 19.5845 21.8577 17.3065C21.1965 16.9113 20.5529 16.4409 21.8577 15.9125Z" fill="currentColor"/></svg>
      <span id="nightText">Light</span>
    </button>
  </div>
</header>

<main class="launch">
  <div class="lp-clockwrap">
    <p class="lp-clock" id="lpClock" aria-label="HH:MM:SS:mmm"></p>
    <p class="lp-clock-zone" id="lpZone"></p>
  </div>
  <div class="lp-grid">
    <a class="lp-card" id="cardClock" href="index.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.5l3.1 1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <strong>Singhoah · <span id="lpClockT">Clock</span></strong>
      <span class="lp-sub" id="lpClockS">Drift-corrected world clock</span>
    </a>
    <a class="lp-card" id="cardWallet" href="wallet.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M3 9.5h18M16 14.2h2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <strong>SinghoWallet · <span id="lpWalletT">Wallet</span></strong>
      <span class="lp-sub" id="lpWalletS">Balance, daily spending &amp; reports</span>
    </a>
  </div>
  <div class="lp-offrow">
    <a class="btn" id="lpOffClock" href="standalone.html">Clock · Offline single-file</a>
    <a class="btn" id="lpOffWallet" href="wallet-standalone.html">Wallet · Offline single-file</a>
  </div>
</main>

<script src="flags.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  const { LANGS, t, langOf, ccFlag, makeLangPicker, formatClock } = globalThis.__SING_LIB;
  try { localStorage.setItem('singhoah:visited', '1'); } catch { /* ignore */ }

  /* small live clock widget */
  const lpClock = document.getElementById('lpClock');
  const slots = [];
  for (let i = 0; i < 12; i++) {
    const sp = document.createElement('span');
    sp.className = 'slot' + (i === 2 || i === 5 || i === 8 ? ' sep' : i >= 9 ? ' ms' : '');
    lpClock.appendChild(sp);
    slots.push(sp);
  }
  (function tick() {
    const str = formatClock(new Date());
    for (let i = 0; i < 12; i++) if (slots[i].textContent !== str[i]) slots[i].textContent = str[i];
    requestAnimationFrame(tick);
  })();
  try { document.getElementById('lpZone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* ignore */ }
  const $ = (id) => document.getElementById(id);
  let lang = 'en';

  function applyLang(id, persist = true) {
    lang = langOf(id).id;
    const L = langOf(lang);
    document.documentElement.lang = L.locale;
    document.documentElement.dir = L.dir;
    $('langFlag').src = ccFlag(L.flag);
    $('langLabel').textContent = lang === 'zh-Hant' ? '繁中' : lang.toUpperCase();
    $('lpClockT').textContent = t(lang, 'lpClock');
    $('lpClockS').textContent = t(lang, 'lpClockSub');
    $('lpWalletT').textContent = t(lang, 'wallet');
    $('lpWalletS').textContent = t(lang, 'lpWalletSub');
    $('lpOffClock').textContent = `${t(lang, 'lpClock')} · ${t(lang, 'lpOffline')}`;
    $('lpOffWallet').textContent = `${t(lang, 'wallet')} · ${t(lang, 'lpOffline')}`;
    $('nightText').textContent = t(lang, document.documentElement.classList.contains('dark') ? 'light' : 'night');
    if (persist) { try { localStorage.setItem('singhoah:lang', lang); } catch { /* ignore */ } }
  }

  let saved = '';
  try { saved = localStorage.getItem('singhoah:lang') || ''; } catch { /* ignore */ }
  applyLang(LANGS.some((l) => l.id === saved) ? saved : 'en', false);
  makeLangPicker($('langBtn'), $('langPop'), $('langList'), (id) => applyLang(id), '.langwrap');

  $('btnNight').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const dark = document.documentElement.classList.contains('dark');
    try { localStorage.setItem('singhoah:night', dark ? '1' : '0'); } catch { /* ignore */ }
    $('nightText').textContent = t(lang, dark ? 'light' : 'night');
  });
</script>
</body>
</html>
