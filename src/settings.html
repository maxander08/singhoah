<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SinghoSettings — language · theme · city · currency</title>
<meta name="description" content="One place for every Singhoah preference: language, appearance, clock city, wallet currency and local data.">
<meta name="color-scheme" content="dark light">
<script>
  try { if ((localStorage.getItem('singhoah:night') || '1') === '1') document.documentElement.classList.add('dark'); }
  catch (e) { document.documentElement.classList.add('dark'); }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2f0e6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23000dff' stroke-width='2.4'/%3E%3Cpath d='M16 6v4M16 22v4M6 16h4M22 16h4M9 9l2.8 2.8M20.2 20.2L23 23M23 9l-2.8 2.8M11.8 20.2L9 23' stroke='%23000' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-app="settings">

<header class="topbar">
  <div class="brand"><p class="wordmark">S<em>ingho</em>Settings</p><p class="wordmark-zh" lang="zh-Hant">設定</p></div>
  <div class="controls">
    <button type="button" class="btn" id="btnNight" aria-pressed="false" title="Toggle night shift (N)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M21.8577 15.9125C20.4575 16.5686 18.8663 16.8635 17.2164 16.6901C12.3885 16.1826 8.88611 11.8575 9.39354 7.02959C9.56355 5.50838 10.1889 3.87875 11.1249 2.64375C7.31883 3.87875 4.64062 7.40498 4.64062 11.5489C4.64062 16.7938 8.88611 21.0489 14.1231 21.0489C17.1979 21.0489 19.9435 19.5845 21.8577 17.3065C19.1965 16.9113 20.5529 16.4409 21.8577 15.9125Z" fill="currentColor"/></svg>
      <span id="nightText">Light</span>
    </button>
    <a class="btn" id="btnLaunch" href="launch.html" title="Launchpad">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg>
      <span id="launchText">Launchpad</span>
    </a>
    <a class="btn" id="btnClock" href="index.html" title="Clock">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.5l3.1 1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="clockText">Clock</span>
    </a>
    <a class="btn" id="btnWallet" href="wallet.html" title="Wallet">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M3 9.5h18M16 14.2h2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span id="walletText">Wallet</span>
    </a>
  <div class="authwrap" id="authWrap"></div>
  </div>
</header>

<main class="settings">
  <div class="set-grid">
    <section class="set-card">
      <h2 class="meta-label" id="hLang">Language</h2>
      <div class="langwrap">
        <button type="button" class="btn tz-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" title="Language · 語言">
          <img id="langFlag" class="flag" alt="" width="20" height="15">
          <span id="langLabel">EN</span>
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <div class="tz-pop lang-pop" id="langPop" hidden>
          <div class="tz-list" id="langList" role="listbox" aria-label="Language"></div>
        </div>
      </div>
    </section>

    <section class="set-card">
      <h2 class="meta-label" id="hTheme">Appearance</h2>
      <button type="button" class="btn" id="btnTheme" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M21.8577 15.9125C20.4575 16.5686 18.8663 16.8635 17.2164 16.6901C12.3885 16.1826 8.88611 11.8575 9.39354 7.02959C9.56355 5.50838 10.1889 3.87875 11.1249 2.64375C7.31883 3.87875 4.64062 7.40498 4.64062 11.5489C4.64062 16.7938 8.88611 21.0489 14.1231 21.0489C17.1979 21.0489 19.9435 19.5845 21.8577 17.3065C19.1965 16.9113 20.5529 16.4409 21.8577 15.9125Z" fill="currentColor"/></svg>
        <span id="themeText">Night Shift</span>
      </button>
    </section>

    <section class="set-card">
      <h2 class="meta-label" id="hAcc">Account</h2>
      <p class="set-note" id="accNote"></p>
    </section>

    <section class="set-card">
      <h2 class="meta-label" id="hData">Data</h2>
      <button type="button" class="btn set-danger" id="btnReset">Reset local data</button>
    </section>

    <section class="set-card">
      <h2 class="meta-label" id="hCity">Clock city</h2>
      <input id="citySearch" class="tz-search" type="search" autocomplete="off" aria-label="Search city or country…">
      <div class="tz-list set-list" id="cityList" role="listbox"></div>
    </section>

    <section class="set-card">
      <h2 class="meta-label" id="hCur">Currency</h2>
      <input id="curSearch" class="tz-search" type="search" autocomplete="off" aria-label="Search currencies…">
      <div class="tz-list set-list" id="curList" role="listbox"></div>
    </section>
  </div>
</main>

<script src="flags.js"></script>
<script type="module" src="app.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module">
  const { LANGS, t, langOf, ccFlag, makeLangPicker, allTimeZones, cityOf, flagSrc, zoneInfo,
          CURRENCIES, curSymbol, curName, curFlag, curAlias, clampPop } = globalThis.__SING_LIB;
  const $ = (id) => document.getElementById(id);
  let lang = 'en';

  const localZone = (() => {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch { return 'UTC'; }
  })();
  let curTz = '';
  try {
    curTz = localStorage.getItem('singhoah:tz') || '';
    if (curTz) new Intl.DateTimeFormat('en', { timeZone: curTz });
  } catch { curTz = ''; }
  const walCur = () => {
    try {
      const w = JSON.parse(localStorage.getItem('singhoah:wallet') || 'null');
      return w && typeof w.cur === 'string' && w.cur ? w.cur : 'USD';
    } catch { return 'USD'; }
  };

  /* ---------- clock city picker ---------- */
  const cityRows = [];
  function markCitySel() {
    for (const r of cityRows) r.el.classList.toggle('sel-cur', r.el.dataset.zone === curTz);
  }
  function mkCityRow(zone, isLocal) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tz-row';
    b.dataset.zone = isLocal ? '' : zone;
    const img = document.createElement('img');
    img.className = 'flag'; img.width = 20; img.height = 15; img.alt = '';
    img.src = flagSrc(zone);
    const city = document.createElement('span');
    city.className = 'tz-city';
    const off = document.createElement('span');
    off.className = 'tz-off';
    off.textContent = zoneInfo(new Date(), zone).utc;
    b.append(img, city, off);
    b.dataset.search = `${zone} ${cityOf(zone)}`.toLowerCase();
    b.addEventListener('click', () => {
      curTz = b.dataset.zone;
      try { localStorage.setItem('singhoah:tz', curTz); } catch { /* ignore */ }
      markCitySel();
    });
    cityRows.push({ el: b, city, isLocal });
    $('cityList').appendChild(b);
  }
  mkCityRow(localZone, true);
  for (const z of allTimeZones()) mkCityRow(z, false);
  function refreshCityLabels() {
    for (const r of cityRows) {
      r.city.textContent = r.isLocal ? `${cityOf(localZone)} · ${t(lang, 'local')}` : cityOf(r.el.dataset.zone);
    }
    markCitySel();
  }
  $('citySearch').addEventListener('input', () => {
    const q = $('citySearch').value.trim().toLowerCase();
    for (const r of cityRows) r.el.hidden = !!q && !r.el.dataset.search.includes(q);
  });

  /* ---------- wallet currency picker ---------- */
  const esc = (v) => String(v ?? '').replace(/[&<>\"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function renderCur() {
    const q = $('curSearch').value.trim().toLowerCase();
    const cur = walCur();
    $('curList').innerHTML = CURRENCIES
      .filter(([code]) => !q
        || code.toLowerCase().includes(q)
        || curSymbol(code, langOf(lang).locale).toLowerCase().includes(q)
        || curName(code, lang).toLowerCase().includes(q)
        || curAlias(code).includes(q))
      .map(([code]) => `
        <div class="tz-row cur-row${code === cur ? ' sel-cur' : ''}" role="option" data-code="${code}">
          <img class="flag" alt="" src="${curFlag(code)}">
          <span class="tz-city">${esc(curName(code, lang))}</span>
          <span class="tz-off">${esc(curSymbol(code, langOf(lang).locale))} · ${code}</span>
        </div>`).join('');
  }
  $('curList').addEventListener('click', (e) => {
    const row = e.target.closest('.cur-row');
    if (!row) return;
    let w = null;
    try { w = JSON.parse(localStorage.getItem('singhoah:wallet') || 'null'); } catch { /* ignore */ }
    if (!w || typeof w !== 'object') w = { cur: 'USD', tx: [] };
    w.cur = row.dataset.code;
    try { localStorage.setItem('singhoah:wallet', JSON.stringify(w)); } catch { /* ignore */ }
    renderCur();
  });
  $('curSearch').addEventListener('input', renderCur);

  /* ---------- theme ---------- */
  function syncTheme() {
    const dark = document.documentElement.classList.contains('dark');
    $('btnNight').setAttribute('aria-pressed', String(dark));
    $('btnTheme').setAttribute('aria-pressed', String(dark));
    const lbl = t(lang, dark ? 'light' : 'night');
    $('nightText').textContent = lbl;
    $('themeText').textContent = lbl;
  }
  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    const dark = document.documentElement.classList.contains('dark');
    try { localStorage.setItem('singhoah:night', dark ? '1' : '0'); } catch { /* ignore */ }
    syncTheme();
  }
  $('btnNight').addEventListener('click', toggleTheme);
  $('btnTheme').addEventListener('click', toggleTheme);

  /* ---------- reset ---------- */
  $('btnReset').addEventListener('click', () => {
    if (!confirm(t(lang, 'resetQ'))) return;
    try {
      const kill = ['singhoah:lang', 'singhoah:night', 'singhoah:tz', 'singhoah:lptz', 'singhoah:authseen'];
      for (const k of kill) localStorage.removeItem(k);
      const keep = { cur: 'USD', tx: [] };
      try {
        const w = JSON.parse(localStorage.getItem('singhoah:wallet') || 'null');
        if (w && Array.isArray(w.tx)) keep.tx = w.tx;
      } catch { /* ignore */ }
      localStorage.setItem('singhoah:wallet', JSON.stringify(keep));
      for (const k of Object.keys(localStorage)) {
        if (k.startsWith('singhoah:profile:')) localStorage.removeItem(k);
      }
      sessionStorage.removeItem('singhoah:authrestored');
    } catch { /* ignore */ }
    location.reload();
  });

  /* ---------- language ---------- */
  function applyLang(id, persist = true) {
    lang = langOf(id).id;
    const L = langOf(lang);
    document.documentElement.lang = L.locale;
    document.documentElement.dir = L.dir;
    $('langFlag').src = ccFlag(L.flag);
    $('langLabel').textContent = lang === 'zh-Hant' ? '繁中' : lang.toUpperCase();
    $('hLang').textContent = t(lang, 'language');
    $('hTheme').textContent = t(lang, 'appearance');
    $('hCity').textContent = t(lang, 'homeCity');
    $('hCur').textContent = t(lang, 'currency');
    $('hAcc').textContent = t(lang, 'account');
    $('hData').textContent = t(lang, 'data');
    $('accNote').textContent = t(lang, 'portalNote');
    $('btnReset').textContent = t(lang, 'resetData');
    $('citySearch').placeholder = t(lang, 'search');
    $('curSearch').placeholder = t(lang, 'walCurSearch');
    $('launchText').textContent = t(lang, 'launchpad');
    $('clockText').textContent = t(lang, 'lpClock');
    $('walletText').textContent = t(lang, 'wallet');
    $('btnLaunch').title = t(lang, 'launchpad');
    $('btnClock').title = t(lang, 'lpClock');
    $('btnWallet').title = t(lang, 'wallet');
    syncTheme();
    refreshCityLabels();
    renderCur();
    if (persist) { try { localStorage.setItem('singhoah:lang', lang); } catch { /* ignore */ } }
    document.dispatchEvent(new CustomEvent('singhoah:lang'));
  }

  let saved = '';
  try { saved = localStorage.getItem('singhoah:lang') || ''; } catch { /* ignore */ }
  applyLang(LANGS.some((l) => l.id === saved) ? saved : 'en', false);
  makeLangPicker($('langBtn'), $('langPop'), $('langList'), (id) => applyLang(id), '.langwrap');

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('langPop').hidden = true;
  });
</script>
</body>
</html>
