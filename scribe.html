<script src="flags.js"></script>
<script type="module" src="app.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module">
  const { LANGS, t, langOf, ccFlag, makeLangPicker } = globalThis.__SING_LIB;
  const $ = (id) => document.getElementById(id);

  /* spoken languages offered to the recognizer (BCP-47) */
  const SR_LANGS = [
    ['zh-TW', '繁體中文'], ['zh-CN', '简体中文'], ['en-US', 'English (US)'], ['en-GB', 'English (UK)'],
    ['ja-JP', '日本語'], ['ko-KR', '한국어'], ['es-ES', 'Español'], ['fr-FR', 'Français'],
    ['de-DE', 'Deutsch'], ['hi-IN', 'हिन्दी'], ['ru-RU', 'Русский'], ['pt-BR', 'Português'], ['ar-SA', 'العربية'],
  ];
  for (const sel of [$('scrIn'), $('scrOut')]) {
    for (const [code, name] of SR_LANGS) {
      const o = document.createElement('option');
      o.value = code; o.textContent = `${name} · ${code}`;
      sel.appendChild(o);
    }
  }

  /* ---------- persistence (Google-Doc style autosave) ---------- */
  const KEY = 'singhoah:scribe';
  let saveTimer = 0;
  let stamps = false;
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && typeof d === 'object') {
        if (typeof d.html === 'string') $('scrDoc').innerHTML = d.html;
        if (typeof d.title === 'string' && d.title) $('scrTitle').value = d.title;
        if (SR_LANGS.some(([c]) => c === d.in)) $('scrIn').value = d.in;
        if (SR_LANGS.some(([c]) => c === d.out)) $('scrOut').value = d.out;
        if (typeof d.stamps === 'boolean') stamps = d.stamps;
      }
    } catch { /* ignore */ }
  }
  function save() {
    $('scrStatus').textContent = t(lang, 'scribeSaving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          html: $('scrDoc').innerHTML, title: $('scrTitle').value,
          in: $('scrIn').value, out: $('scrOut').value, stamps,
        }));
      } catch { /* ignore */ }
      $('scrStatus').textContent = t(lang, 'scribeSaved');
    }, 600);
  }

  /* ---------- document ---------- */
  function words() {
    const m = $('scrDoc').textContent.replace(/​/g, '').match(/[\u3400-\u9fff\uf900-\ufaff]|\w+/g);
    return m ? m.length : 0;
  }
  function chars() { return $('scrDoc').textContent.replace(/​/g, '').length; }
  function count() {
    $('scrCount').textContent = `${words()} ${t(lang, 'scribeWords')} · ${chars()} ${t(lang, 'scribeChars')}`;
  }
  function interimEl(remove) {
    const ex = $('scrDoc').querySelector('#scrInterim');
    if (remove && ex) ex.remove();
    return ex;
  }
  function setInterim(text) {
    let el = interimEl(false);
    if (!text) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('p');
      el.id = 'scrInterim';
      el.className = 'scr-interim';
      $('scrDoc').appendChild(el);
    }
    el.textContent = text;
    $('scrDoc').parentElement.scrollTop = $('scrDoc').parentElement.scrollHeight;
  }
  function stampNow() {
    const el = document.createElement('span');
    el.className = 'scr-stamp';
    try {
      el.textContent = new Intl.DateTimeFormat(langOf(lang).locale,
        { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
    } catch { el.textContent = new Date().toTimeString().slice(0, 8); }
    return el;
  }
  function appendFinal(text) {
    if (!text) return;
    interimEl(true);
    const p = document.createElement('p');
    if (stamps) { p.appendChild(stampNow()); p.appendChild(document.createTextNode(' ')); }
    p.appendChild(document.createTextNode(text));
    $('scrDoc').appendChild(p);
    count(); save();
    $('scrDoc').parentElement.scrollTop = $('scrDoc').parentElement.scrollHeight;
  }
  async function translate(text, from, to) {
    try {
      const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(from)}|${encodeURIComponent(to)}`);
      const j = await r.json();
      const s = j && j.responseData && j.responseData.translatedText;
      if (typeof s === 'string' && s && !/MYMEMORY/i.test(s)) return s;
    } catch { /* offline: keep original */ }
    return text;
  }

  /* ---------- speech recognition ---------- */
  const SR = globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition;
  let rec = null, listening = false;
  let listenSec = 0, tickT = 0;
  const fmtTime = () => {
    const mm = String(Math.floor(listenSec / 60)).padStart(2, '0');
    const ss = String(listenSec % 60).padStart(2, '0');
    $('scrTime').textContent = `${mm}:${ss}`;
    $('scrTime').title = t(lang, 'scribeListening');
  };
  function stampsUI() { $('scrStamps').setAttribute('aria-pressed', String(stamps)); }
  function micUI() {
    $('scrMic').setAttribute('aria-pressed', String(listening));
    $('scrMicText').textContent = t(lang, listening ? 'scribeStop' : 'scribeStart');
    $('scrListen').textContent = listening ? t(lang, 'scribeListening') : '';
  }
  function startRec() {
    if (!SR) { $('scrStatus').textContent = t(lang, 'scribeNo'); return; }
    if (listening) return;
    listening = true;
    micUI();
    listenSec = 0; fmtTime(); $('scrTime').hidden = false;
    clearInterval(tickT); tickT = setInterval(() => { listenSec += 1; fmtTime(); }, 1000);
    const loop = () => {
      rec = new SR();
      rec.lang = $('scrIn').value;
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) {
            const text = r[0].transcript.trim();
            if (!text) continue;
            const from = $('scrIn').value, to = $('scrOut').value;
            if (from === to) appendFinal(text);
            else translate(text, from, to).then(appendFinal);
          } else interim += r[0].transcript;
        }
        setInterim(interim.trim());
      };
      rec.onend = () => { if (listening) { try { loop(); } catch { listening = false; micUI(); } } else setInterim(''); };
      rec.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
          listening = false; micUI();
          $('scrStatus').textContent = t(lang, 'scribeNo');
        }
      };
      try { rec.start(); } catch { listening = false; micUI(); }
    };
    loop();
  }
  function stopRec() { listening = false; clearInterval(tickT); $('scrTime').hidden = true; try { if (rec) rec.stop(); } catch { /* ignore */ } micUI(); }
  $('scrMic').addEventListener('click', () => { if (listening) stopRec(); else startRec(); });
  $('scrIn').addEventListener('change', () => { if (listening) { stopRec(); startRec(); } save(); });
  $('scrOut').addEventListener('change', save);

  /* ---------- toolbar ---------- */
  $('scrCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('scrDoc').textContent.replace(/\u200b/g, '').trim()); } catch { /* ignore */ }
  });
  $('scrDl').addEventListener('click', () => {
    const name = ($('scrTitle').value.trim() || 'singhoscribe') + '.txt';
    const blob = new Blob([$('scrDoc').textContent.replace(/\u200b/g, '').trim()], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 500);
  });
  $('scrClear').addEventListener('click', () => {
    if (!confirm(t(lang, 'resetQ'))) return;
    $('scrDoc').innerHTML = '';
    count(); save();
  });
  $('scrUndo').addEventListener('click', () => { $('scrDoc').focus(); document.execCommand('undo'); });
  $('scrRedo').addEventListener('click', () => { $('scrDoc').focus(); document.execCommand('redo'); });
  $('scrPrint').addEventListener('click', () => window.print());
  $('scrStamps').addEventListener('click', () => { stamps = !stamps; stampsUI(); save(); });
  $('scrImport').addEventListener('click', () => $('scrFile').click());
  $('scrFile').addEventListener('change', async () => {
    const f = $('scrFile').files && $('scrFile').files[0];
    if (!f) return;
    try {
      const txt = await f.text();
      for (const line of txt.split(/\r?\n+/)) {
        const one = line.trim();
        if (!one) continue;
        const p = document.createElement('p');
        p.textContent = one;
        $('scrDoc').appendChild(p);
      }
      count(); save();
    } catch { /* unreadable file */ }
    $('scrFile').value = '';
  });

  /* ---------- find & replace ---------- */
  const docEl2 = $('scrDoc');
  let fCur = -1;
  function clearHl() {
    for (const m of [...docEl2.querySelectorAll('mark.scr-hl')]) {
      const par = m.parentNode;
      par.replaceChild(document.createTextNode(m.textContent), m);
      par.normalize();
    }
    fCur = -1;
  }
  function findAll(q) {
    clearHl();
    if (!q) return 0;
    const ql = q.toLowerCase();
    const nodes = [];
    const walker = document.createTreeWalker(docEl2, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let total = 0;
    for (const n of nodes) {
      const txt = n.textContent, lt = txt.toLowerCase();
      if (lt.indexOf(ql) < 0) continue;
      const frag = document.createDocumentFragment();
      let pos = 0, i = lt.indexOf(ql);
      while (i >= 0) {
        if (i > pos) frag.appendChild(document.createTextNode(txt.slice(pos, i)));
        const mk = document.createElement('mark');
        mk.className = 'scr-hl';
        mk.textContent = txt.slice(i, i + q.length);
        frag.appendChild(mk);
        pos = i + q.length; total += 1;
        i = lt.indexOf(ql, pos);
      }
      if (pos < txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
      n.parentNode.replaceChild(frag, n);
    }
    return total;
  }
  const marks = () => [...docEl2.querySelectorAll('mark.scr-hl')];
  function goMark(idx) {
    const ms = marks();
    if (!ms.length) { $('scrFindCount').textContent = t(lang, 'scribeNoHits'); return; }
    ms.forEach((m) => m.classList.remove('scr-cur'));
    fCur = ((idx % ms.length) + ms.length) % ms.length;
    ms[fCur].classList.add('scr-cur');
    ms[fCur].scrollIntoView({ block: 'center' });
    $('scrFindCount').textContent = `${fCur + 1}/${ms.length}`;
  }
  function doFind() {
    const q = $('scrFindIn').value.trim();
    const n = findAll(q);
    if (n) goMark(0);
    else $('scrFindCount').textContent = q ? t(lang, 'scribeNoHits') : '';
  }
  function replOne() {
    const ms = marks();
    if (!ms.length) return;
    const m = ms[(fCur < 0 ? 0 : fCur) % ms.length];
    m.replaceWith(document.createTextNode($('scrReplIn').value));
    count(); save(); doFind();
  }
  function replAll() {
    const q = $('scrFindIn').value.trim();
    if (!q) return;
    const ql = q.toLowerCase(), rv = $('scrReplIn').value;
    clearHl();
    const nodes = [];
    const walker = document.createTreeWalker(docEl2, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let hits = 0;
    for (const node of nodes) {
      const txt = node.textContent, lt = txt.toLowerCase();
      if (lt.indexOf(ql) < 0) continue;
      let out = '', pos = 0, i = lt.indexOf(ql);
      while (i >= 0) { out += txt.slice(pos, i) + rv; pos = i + q.length; hits += 1; i = lt.indexOf(ql, pos); }
      out += txt.slice(pos);
      node.textContent = out;
    }
    if (hits) { count(); save(); }
    doFind();
  }
  $('scrFind').addEventListener('click', () => {
    $('scrFindBar').hidden = !$('scrFindBar').hidden;
    if (!$('scrFindBar').hidden) $('scrFindIn').focus(); else clearHl();
  });
  $('scrFindIn').addEventListener('input', doFind);
  $('scrFindNext').addEventListener('click', () => goMark(fCur + 1));
  $('scrFindPrev').addEventListener('click', () => goMark(fCur - 1));
  $('scrReplOne').addEventListener('click', replOne);
  $('scrReplAll').addEventListener('click', replAll);
  $('scrFindX').addEventListener('click', () => { $('scrFindBar').hidden = true; clearHl(); });
  $('scrDoc').addEventListener('input', () => { count(); save(); });
  $('scrTitle').addEventListener('input', save);

  /* ---------- UI language ---------- */
  let lang = 'en';
  function applyLang(id, persist = true) {
    lang = langOf(id).id;
    const L = langOf(lang);
    document.documentElement.lang = L.locale;
    document.documentElement.dir = L.dir;
    $('langFlag').src = ccFlag(L.flag);
    $('langLabel').textContent = lang === 'zh-Hant' ? '繁中' : lang.toUpperCase();
    $('lblIn').textContent = t(lang, 'scribeIn');
    $('lblOut').textContent = t(lang, 'scribeOut');
    $('scrIn').title = t(lang, 'scribeIn');
    $('scrOut').title = t(lang, 'scribeOut');
    $('scrCopy').textContent = t(lang, 'scribeCopy');
    $('scrDl').textContent = t(lang, 'scribeDownload');
    $('scrClear').textContent = t(lang, 'scribeClear');
    $('scrCopy').title = t(lang, 'scribeCopy');
    $('scrDl').title = t(lang, 'scribeDownload');
    $('scrClear').title = t(lang, 'scribeClear');
    $('scrUndo').title = t(lang, 'scribeUndo'); $('scrUndo').setAttribute('aria-label', t(lang, 'scribeUndo'));
    $('scrRedo').title = t(lang, 'scribeRedo'); $('scrRedo').setAttribute('aria-label', t(lang, 'scribeRedo'));
    $('scrFind').title = t(lang, 'scribeFind'); $('scrFind').setAttribute('aria-label', t(lang, 'scribeFind'));
    $('scrStamps').title = t(lang, 'scribeStamps'); $('scrStamps').setAttribute('aria-label', t(lang, 'scribeStamps'));
    $('scrImport').title = t(lang, 'scribeImport'); $('scrImport').setAttribute('aria-label', t(lang, 'scribeImport'));
    $('scrPrint').title = t(lang, 'scribePrint'); $('scrPrint').setAttribute('aria-label', t(lang, 'scribePrint'));
    $('scrFindIn').placeholder = t(lang, 'scribeFind');
    $('scrReplIn').placeholder = t(lang, 'scribeReplace');
    $('scrReplOne').textContent = t(lang, 'scribeReplace');
    $('scrReplAll').textContent = t(lang, 'scribeReplaceAll');
    $('launchText').textContent = t(lang, 'launchpad');
    $('settingsText').textContent = t(lang, 'settings');
    $('btnLaunch').title = t(lang, 'launchpad');
    $('btnSettings').title = t(lang, 'settings');
    const dark = document.documentElement.classList.contains('dark');
    $('nightText').textContent = t(lang, dark ? 'light' : 'night');
    $('scrStatus').textContent = t(lang, 'scribeSaved');
    $('scrDoc').dataset.hint = t(lang, 'scribeHint');
    micUI(); count();
    if (persist) { try { localStorage.setItem('singhoah:lang', lang); } catch { /* ignore */ } }
    document.dispatchEvent(new CustomEvent('singhoah:lang'));
  }
  $('btnNight').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const dark = document.documentElement.classList.contains('dark');
    try { localStorage.setItem('singhoah:night', dark ? '1' : '0'); } catch { /* ignore */ }
    $('nightText').textContent = t(lang, dark ? 'light' : 'night');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      $('langPop').hidden = true;
      if (!$('scrFindBar').hidden) { $('scrFindBar').hidden = true; clearHl(); }
      return;
    }
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); $('scrFindBar').hidden = false; $('scrFindIn').focus(); }
    else if (e.key === 'h' || e.key === 'H') { e.preventDefault(); $('scrFindBar').hidden = false; $('scrReplIn').focus(); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); save(); }
  });

  load();
  stampsUI();
  let saved = '';
  try { saved = localStorage.getItem('singhoah:lang') || ''; } catch { /* ignore */ }
  applyLang(LANGS.some((l) => l.id === saved) ? saved : 'en', false);
  makeLangPicker($('langBtn'), $('langPop'), $('langList'), (id) => applyLang(id), '.langwrap');
  count();
  $('scrStatus').textContent = t(lang, 'scribeSaved');
</script>
</body>
</html>
